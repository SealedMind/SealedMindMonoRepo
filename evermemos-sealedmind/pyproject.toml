[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evermemos-sealedmind"
version = "0.1.0"
description = "SealedMind privacy adapter for 0G Memory (EverMemOS) — encrypted-at-rest storage, wallet-bound secrets, and on-chain capability sharing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SealedMind" }]
keywords = ["0g", "evermemos", "memory", "privacy", "encryption", "web3", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0.0",
    "eth-account>=0.11.0",
    "eth-utils>=4.0.0",
    "siwe>=4.2.0",
    "web3>=6.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "zg-storage>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.entry-points."memsys.addons"]
sealedmind = "evermemos_sealedmind.addon"

[project.urls]
Homepage = "https://github.com/sealedmind/evermemos-sealedmind"
Documentation = "https://github.com/sealedmind/evermemos-sealedmind#readme"
Repository = "https://github.com/sealedmind/evermemos-sealedmind"

[tool.setuptools.packages.find]
include = ["evermemos_sealedmind*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
