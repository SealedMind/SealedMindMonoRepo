[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sealedmind"
version = "0.1.0"
description = "Python SDK for SealedMind — encrypted, capability-gated AI memory on 0G."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SealedMind" }]
keywords = ["ai", "memory", "0g", "tee", "web3", "privacy", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
siwe = [
    "eth-account>=0.11.0",
    "siwe>=4.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/SealedMind/SealedMindMonoRepo"
Documentation = "https://github.com/SealedMind/SealedMindMonoRepo/blob/main/OVERVIEW.md"
Repository = "https://github.com/SealedMind/SealedMindMonoRepo"

[tool.setuptools.packages.find]
include = ["sealedmind*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
